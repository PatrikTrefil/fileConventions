name: Build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            extension: exe
          - os: macos-15
            platform: macos
            extension: dmg
          - os: ubuntu-22.04
            platform: linux
            extension: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Find Windows WiX tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | Select-Object -First 1
          if (-not $wixBin) { throw 'WiX Toolset 3 is required by JDK 17 jpackage' }
          Join-Path $wixBin.FullName 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Validate release version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Release tags must be vMAJOR.MINOR.PATCH'; exit 1; }
          else
            version="1.0.0"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Test and build installer
        run: bash ./gradlew --no-daemon --stacktrace -PreleaseVersion=${{ steps.version.outputs.value }} test jpackage
      - name: Collect installer and checksum
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          packages=(build/jpackage/*.${{ matrix.extension }})
          [[ ${#packages[@]} -eq 1 ]] || { echo 'Expected exactly one installer'; exit 1; }
          asset="File-Conventions-${{ steps.version.outputs.value }}-${{ matrix.platform }}-${RUNNER_ARCH}.${{ matrix.extension }}"
          cp "${packages[0]}" "artifacts/$asset"
          cd artifacts
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: artifacts
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --title "File Conventions ${GITHUB_REF_NAME#v}"
          fi
