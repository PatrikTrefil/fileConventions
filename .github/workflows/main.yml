name: CI
on:
  push:
  workflow_dispatch:

jobs:
  test-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 18

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Test
        run: ./gradlew test

      - name: Run format
        run: ./gradlew ktfmtCheck
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macOS-latest, windows-latest ]
      fail-fast: false

    name: ${{ matrix.os }}
    
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 18

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Execute build
        run: ./gradlew --info --stacktrace build
        
      - name: Execute runtime
        run: ./gradlew --info --stacktrace runtime
        
      - name: Execute jpackage
        run: ./gradlew --info --stacktrace jpackage
        
      - name: Upload DMG as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-conventions-${{ matrix.java }}-${{ matrix.os }}-dmg
          path: build/jpackage/*.dmg
          
      - name: Upload EXE as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-conventions-${{ matrix.java }}-${{ matrix.os }}-exe
          path: build/jpackage/*.exe
          
      - name: Upload MSI as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-conventions-${{ matrix.java }}-${{ matrix.os }}-msi
          path: build/jpackage/*.msi
      - name: Upload DEB as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-conventions-${{ matrix.java }}-${{ matrix.os }}-deb
          path: build/jpackage/*.deb
      - name: Upload RPM as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-conventions-${{ matrix.java }}-${{ matrix.os }}-rpm
          path: build/jpackage/*.rpm
