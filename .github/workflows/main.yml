name: CI
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: gradle/actions/setup-gradle@v3

      - name: Run build
        run: ./gradlew build

      - name: Run Test
        run: ./gradlew test

      - name: Run format
        run: ./gradlew ktfmtCheck
